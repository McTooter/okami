name: Package Okami SideStore IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-unsigned-ipa:
    name: Build unsigned IPA for SideStore
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: |
          pnpm run check
          pnpm run lint
          pnpm test

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --non-interactive --clean

      - name: Build a device app without distribution signing
        id: unsigned_build
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          DERIVED_DATA="$RUNNER_TEMP/okami-derived-data"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package the unsigned IPA
        run: |
          ARTIFACT_ROOT="$RUNNER_TEMP/okami-ipa"
          mkdir -p "$ARTIFACT_ROOT/Payload"
          ditto "${{ steps.unsigned_build.outputs.app_path }}" "$ARTIFACT_ROOT/Payload/Okami.app"
          ditto -c -k --sequesterRsrc --keepParent "$ARTIFACT_ROOT/Payload" okami-sidestore-unsigned.ipa
          unzip -l okami-sidestore-unsigned.ipa | grep -q 'Payload/Okami.app/Info.plist'

      - name: Upload SideStore IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: okami-sidestore-unsigned-ipa
          path: okami-sidestore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
